<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f7f7f8" />
<title>加载中…</title>
<meta name="description" id="metaDesc" content="" />
<link rel="stylesheet" href="/assets/style.css?v=8" />
</head>
<body>

<div class="boot" id="boot"><div class="boot-spin"></div></div>

<div class="bg" id="bg"></div>
<div class="bg-veil"></div>

<div class="not-ready card" id="notReady" hidden>
  <h1>网站还在准备中</h1>
  <p>管理员还没有完成初始化。</p>
  <p>请访问 <code>/backstage</code> 完成设置。</p>
</div>

<div class="page" id="page" hidden>

  <header class="navbar card" id="navbar">
    <div class="nav-left">
      <img class="nav-avatar" id="navAvatar" alt="" hidden />
      <div class="nav-avatar-fallback" id="navAvatarFallback" hidden></div>
      <span class="nav-name" id="navName"></span>
    </div>
    <div class="nav-right" id="navSocials"></div>
  </header>

  <div class="layout">

    <aside class="sidebar card reveal" id="sidebar">
      <div class="avatar-wrap anim-avatar" id="avatarWrap">
        <img class="avatar" id="avatar" alt="" hidden />
        <div class="avatar-fallback" id="avatarFallback" hidden></div>
      </div>
      <h1 class="name" id="name"></h1>
      <p class="username" id="username"></p>
      <p class="bio-quote" id="bioQuote" hidden></p>

      <div class="social-list" id="socialList"></div>
    </aside>

    <section class="content">

      <div class="card about reveal" id="aboutCard">
        <h2 class="section-title">关于我</h2>
        <p class="about-text" id="aboutText"></p>
      </div>

      <div class="card projects reveal" id="projectsCard" hidden>
        <h2 class="section-title">开源项目</h2>
        <div id="repoStatus" class="projects-status">正在加载项目…</div>
        <div class="repo-grid" id="repoGrid"></div>
      </div>

      <div class="card contribution reveal" id="contribCard" hidden>
        <h2 class="section-title">GitHub 贡献</h2>
        <div class="contribution-wrap">
          <img id="contribImg" alt="GitHub 贡献图" />
        </div>
      </div>

    </section>
  </div>

  <footer class="site-footer" id="siteFooter" hidden></footer>

  <div class="source-note" id="sourceNote">
    <a href="https://github.com/Pixric/Personal-website" target="_blank" rel="noopener">
      在 GitHub 查看我们的源码
    </a>
  </div>
</div>

<div class="player" id="player" hidden>
  <div class="player-main" id="playerMain">
    <div class="art-wrap">
      <svg class="progress-ring" viewBox="0 0 50 50">
        <circle class="ring-bg" cx="25" cy="25" r="21" />
        <circle class="ring-fg" id="ringFg" cx="25" cy="25" r="21" />
      </svg>
      <img class="player-art" id="playerArt" alt="" hidden />
      <div class="player-art" id="playerArtFallback"></div>
    </div>
    <div class="player-text">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-hint" id="playerHint">点击播放</div>
    </div>
    <button class="player-btn" id="playerPrev" aria-label="上一首" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button class="player-toggle" id="playerToggle" aria-label="播放/暂停" type="button">
      <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
      <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="player-btn" id="playerNext" aria-label="下一首" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <button class="player-btn" id="playerListBtn" aria-label="播放列表" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
  </div>

  <div class="player-list" id="playerList" hidden>
    <div class="pl-head">
      <input type="search" class="pl-search" id="plSearch" placeholder="搜索歌曲或歌手…" />
    </div>
    <div class="pl-items" id="plItems"></div>
  </div>

  <div class="player-expand">
    <div class="seek-row">
      <span class="seek-time" id="timeCurrent">0:00</span>
      <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" step="0.1" />
      <span class="seek-time" id="timeTotal">0:00</span>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="/assets/icons.js?v=8"></script>
<script src="/assets/app.js?v=8"></script>
</body>
</html>
