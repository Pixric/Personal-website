<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卡密提取</title>
<link rel="stylesheet" href="/assets/style.css?v=24" />
<link rel="stylesheet" href="/assets/faka.css?v=24" />
<link rel="stylesheet" href="/assets/kami.css?v=24" />
</head>
<body class="kami-page">

<div class="bg" id="bg"></div>
<div class="bg-veil"></div>

<div class="boot" id="boot"><div class="boot-spin"></div></div>

<div class="kami-wrap" id="kamiWrap" hidden>

  <div class="kami-state" id="kamiLoading">
    <div class="ks-spin"></div>
    <h1 class="ks-title">正在确认支付结果</h1>
    <p class="ks-sub">请稍候，正在向支付平台核实…</p>
    <div class="ks-order" id="ksOrder"></div>
  </div>

  <div class="kami-state" id="kamiSuccess" hidden>
    <div class="ks-icon ok">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </div>
    <h1 class="ks-title">支付成功</h1>
    <p class="ks-sub">感谢你的支持，卡密已发放</p>
  </div>

  <div class="kami-state" id="kamiFail" hidden>
    <div class="ks-icon fail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.5"/></svg>
    </div>
    <h1 class="ks-title" id="kamiFailTitle">暂未确认支付</h1>
    <p class="ks-sub" id="kamiFailSub">如已付款，请凭订单号联系站长</p>
  </div>

  <div class="kami-card" id="kamiCard" hidden>
    <div class="kc-label">卡密</div>
    <div class="kc-code" id="kcCode"></div>
    <button class="kc-copy" id="kcCopy" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
      <span id="kcCopyText">复制卡密</span>
    </button>
  </div>

  <div class="order-panel" id="orderPanel" hidden>
    <h2 class="op-title">订单详情</h2>
    <div class="op-grid">
      <div class="op-item"><span>订单号</span><b id="opNo">—</b></div>
      <div class="op-item"><span>商品名称</span><b id="opGoods">—</b></div>
      <div class="op-item"><span>支付金额</span><b id="opAmount">—</b></div>
      <div class="op-item"><span>支付方式</span><b id="opPaytype">—</b></div>
      <div class="op-item" id="opPhoneWrap" hidden><span>购买手机号</span><b id="opPhone">—</b></div>
      <div class="op-item"><span>下单时间</span><b id="opTime">—</b></div>
      <div class="op-item"><span>支付时间</span><b id="opPaidTime">—</b></div>
      <div class="op-item" id="opTradeWrap" hidden><span>平台流水号</span><b id="opTrade">—</b></div>
    </div>
    <div class="op-hint">请截图保存本页，或复制卡密妥善保管</div>
  </div>

  <div class="aftersale-panel" id="aftersalePanel" hidden>
    <h2 class="as-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>
      <span>售后与帮助</span>
    </h2>
    <div class="as-body" id="aftersaleBody"></div>
  </div>

  <div class="kami-actions">
    <a class="ka-btn" href="/faka">继续购买</a>
    <a class="ka-btn ghost" href="/">返回主页</a>
  </div>

</div>

<script src="/assets/kami.js?v=24"></script>
</body>
</html>
